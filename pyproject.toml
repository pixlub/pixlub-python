[build-system]
# 77: first setuptools to read `license` as an SPDX expression (PEP 639).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixlub"
# The version lives in src/pixlub/_version.py only (read without importing the package).
dynamic = ["version"]
description = "Official Python SDK for the Pixlub image API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1"]
keywords = ["pixlub", "image", "image processing", "background removal", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://pixlub.com"
Documentation = "https://pixlub.com/en/docs/api/getting-started"
Modules = "https://pixlub.com/en/docs/modules"
"API reference" = "https://api.pixlub.com/docs"
Source = "https://github.com/pixlub/pixlub-python"
Issues = "https://github.com/pixlub/pixlub-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.dynamic]
version = { attr = "pixlub._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixlub = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src/pixlub"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on purpose, and the examples are scripts, not library code.
"tests/**" = ["S"]
"examples/**" = ["S"]
